<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Mutation in protein structural context</title>
<desc id="svg-desc">An illustrative folded protein ribbon marks a candidate mutation and a functional site, alongside questions for evaluating structural evidence.</desc>
<rect width="1100" height="520" rx="24" fill="#F5F7FA"/>
<text x="48" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20324A">Explore a mutation in structural context</text>
<text x="48" y="88" font-family="Arial,sans-serif" font-size="15" fill="#607188">Schematic protein ribbon — not a structure for a specific variant.</text>
<rect x="40" y="116" width="646" height="366" rx="20" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/>
<path d="M105 309 C132 207 200 190 235 262 S300 354 336 270 S411 171 449 231 S491 345 535 298 S602 221 652 256" fill="none" stroke="#4E78C4" stroke-width="23" stroke-linecap="round" opacity=".9"/>
<path d="M110 338 C158 394 208 369 249 322 S314 229 357 237 S414 324 453 355 S517 365 560 316 S615 251 655 281" fill="none" stroke="#358F7D" stroke-width="18" stroke-linecap="round" opacity=".9"/>
<path d="M139 251 C171 291 220 305 262 277 S329 196 369 189 S427 224 454 278 S505 322 542 287" fill="none" stroke="#8E70AB" stroke-width="15" stroke-linecap="round" opacity=".9"/>
<path d="M280 286l-27-42" stroke="#C65A55" stroke-width="5" stroke-linecap="round"/><circle cx="247" cy="235" r="13" fill="#C65A55" stroke="#FFFFFF" stroke-width="4"/>
<path d="M242 218L213 185" stroke="#C65A55" stroke-width="2"/><rect x="70" y="142" width="160" height="40" rx="10" fill="#F9ECEA"/><text x="150" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#924541">Candidate mutation</text>
<circle cx="520" cy="307" r="12" fill="#DE8A4A" stroke="#FFFFFF" stroke-width="4"/><path d="M529 298l28-35" stroke="#DE8A4A" stroke-width="2"/><rect x="507" y="222" width="146" height="40" rx="10" fill="#FBF2E9"/><text x="580" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#87582F">Functional site</text>
<text x="83" y="454" font-family="Arial,sans-serif" font-size="13" fill="#607188">Illustrative folded chain</text>
<rect x="710" y="116" width="350" height="366" rx="20" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/>
<text x="742" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#20324A">Questions to ask</text>
<circle cx="751" cy="205" r="5" fill="#4E78C4"/><text x="770" y="211" font-family="Arial,sans-serif" font-size="15" fill="#40536D">Which domain or interface?</text>
<circle cx="751" cy="249" r="5" fill="#4E78C4"/><text x="770" y="255" font-family="Arial,sans-serif" font-size="15" fill="#40536D">Near a ligand or active site?</text>
<circle cx="751" cy="293" r="5" fill="#4E78C4"/><text x="770" y="299" font-family="Arial,sans-serif" font-size="15" fill="#40536D">Buried or solvent exposed?</text>
<circle cx="751" cy="337" r="5" fill="#4E78C4"/><text x="770" y="343" font-family="Arial,sans-serif" font-size="15" fill="#40536D">What chemistry changes?</text>
<rect x="738" y="373" width="294" height="78" rx="12" fill="#F0F4F8"/>
<text x="885" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334B68">Observed structure ≠ predicted effect</text>
<text x="885" y="427" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52667E">Separate evidence from interpretation.</text>
</svg>