<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Science agent workflow</title>
<desc id="svg-desc">Four stages: ask a research question, use an agent workspace and scientific tools, then review the evidence and conclusions.</desc>
<rect width="1200" height="540" rx="24" fill="#F5F7FA"/>
<text x="54" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20324A">Question to evidence</text>
<text x="54" y="88" font-family="Arial,sans-serif" font-size="16" fill="#607188">A science agent organizes the work; a person evaluates each claim.</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#91A0B2"/></marker></defs>
<rect x="42" y="145" width="248" height="244" rx="18" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/>
<circle cx="76" cy="180" r="17" fill="#E8EEF9"/><text x="76" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4E78C4">1</text>
<text x="105" y="187" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20324A">Question</text>
<path d="M76 226h180v100H76z" rx="12" fill="#F7F9FC" stroke="#E4EAF1"/>
<text x="96" y="264" font-family="Arial,sans-serif" font-size="16" fill="#40536D">What evidence could</text><text x="96" y="290" font-family="Arial,sans-serif" font-size="16" fill="#40536D">explain this result?</text>
<path d="M292 266h34" stroke="#91A0B2" stroke-width="3" marker-end="url(#arrow)"/><path d="M583 266h34" stroke="#91A0B2" stroke-width="3" marker-end="url(#arrow)"/><path d="M874 266h34" stroke="#91A0B2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="333" y="145" width="248" height="244" rx="18" fill="#273E69"/>
<circle cx="367" cy="180" r="17" fill="#E4EBF8"/><text x="367" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4E78C4">2</text>
<text x="396" y="187" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Agent workspace</text>
<text x="457" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#FFFFFF">Plan</text>
<path d="M357 260h200M357 312h200" stroke="#526A91" stroke-width="1"/>
<text x="457" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#FFFFFF">Run</text>
<text x="457" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#FFFFFF">Inspect</text>
<rect x="624" y="145" width="248" height="244" rx="18" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/>
<circle cx="658" cy="180" r="17" fill="#E4F1EE"/><text x="658" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#358F7D">3</text>
<text x="687" y="187" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20324A">Tools and sources</text>
<rect x="650" y="220" width="196" height="42" rx="10" fill="#EFF5F4"/><text x="748" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#2B5F58">Local files</text>
<rect x="650" y="276" width="196" height="42" rx="10" fill="#EEF1F8"/><text x="748" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#405B8A">Python / R</text>
<rect x="650" y="332" width="196" height="42" rx="10" fill="#FBF2E9"/><text x="748" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#87582F">Scientific databases</text>
<rect x="915" y="145" width="248" height="244" rx="18" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/>
<circle cx="949" cy="180" r="17" fill="#F8EDE5"/><text x="949" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#DE8A4A">4</text>
<text x="978" y="187" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20324A">Evidence</text>
<text x="946" y="244" font-family="Arial,sans-serif" font-size="15" fill="#40536D">Code and figures</text>
<text x="946" y="278" font-family="Arial,sans-serif" font-size="15" fill="#40536D">Tables and sources</text>
<text x="946" y="312" font-family="Arial,sans-serif" font-size="15" fill="#40536D">Limits and conclusions</text>
<rect x="127" y="427" width="946" height="64" rx="16" fill="#E8F2EF" stroke="#C9E0D9"/>
<circle cx="164" cy="459" r="12" fill="#358F7D"/><path d="M158 459l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2B5F58">Human review  ·  Check evidence  ·  Question assumptions  ·  Revise the plan</text>
</svg>